name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned exactly: setup-uv stopped publishing floating major tags after
        # v7.6, so `@v9` does not resolve.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies (default + dev groups)
        run: uv sync --python ${{ matrix.python-version }}

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        if: matrix.python-version == '3.12'
        # The mypy configuration targets Python 3.12 so it can parse NumPy 2.x
        # PEP 695 stubs. Both matrix entries still run the tests below.
        run: uv run mypy src

      - name: Tests
        # Default marker filter (perf_budget + network) is excluded via
        # pyproject addopts; run the rest in parallel.
        run: uv run pytest -n auto
